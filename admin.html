<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Verwaltung – Stunden-Checker</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#5b6678;--card:#fff;--line:#d9dee7;--ac:#1f5fa8}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--fg:#e8edf4;--mut:#9aa7ba;--card:#1a222d;--line:#2c3746;--ac:#7db3f0}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:16px}
main{max-width:900px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
h1{font-size:1.3rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
input,button{font:inherit;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mut{color:var(--mut)}.fb{border-bottom:1px solid var(--line);padding:8px 0}.fb img{max-width:100%;max-height:260px;border-radius:6px;margin-top:6px}
.scroll{overflow-x:auto}[hidden]{display:none!important}
</style></head><body><main>
<div class="card"><h1>Verwaltung</h1><p class="mut" id="who">Nicht angemeldet.</p>
<form id="lf" style="display:grid;gap:8px;max-width:340px"><input type="email" id="m" placeholder="E-Mail" autocomplete="username"><input type="password" id="p" placeholder="Passwort" autocomplete="current-password"><button>Anmelden</button><small class="mut" id="msg"></small></form>
<button id="gl" style="margin-top:8px">Mit Google anmelden</button>
<p id="ver" class="mut"></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="vs" hidden>Bestätigungsmail senden</button><button id="vr" hidden>Neu prüfen</button><button id="out" hidden>Abmelden</button></div></div>
<div id="dash" hidden>
<div class="card"><h2>Überblick</h2><div id="ov"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button id="cp">Alles kopieren</button><button id="dl">Als Textdatei speichern</button></div><small class="mut" id="cpm"></small></div>
<div class="card"><h2>Nutzung der Funktionen (Anzahl, alle Konten)</h2><div id="fe"></div></div>
<div class="card"><h2>Mia</h2><div id="mi"></div></div>
<div class="card"><h2>Rückmeldungen</h2><div id="fbf" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button type="button" data-f="offen">Offen</button><button type="button" data-f="erledigt">Erledigt</button><button type="button" data-f="alle">Alle</button></div><p class="mut" id="fbm"></p><div id="fbl"></div></div>
<div class="card"><h2>Anmeldungen (neueste zuerst)</h2><div class="scroll" id="an"></div></div>
<div class="card"><h2>Konten</h2><div class="scroll" id="pl"></div></div>
<div class="card"><h2>Was hat wer ausgelöst? (je Konto)</h2><div id="wk"></div></div>
<div class="card"><h2>Fragen, die Mia nicht beantworten konnte</h2><div id="mo"></div></div>
<div class="card"><h2>Abweichungen (anonym, nur mit Einwilligung)</h2><div class="scroll" id="st"></div></div>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
firebase.initializeApp(window.FIREBASE_CONFIG);var db=firebase.firestore(),auth=firebase.auth();
function fmt(v){try{var d=v&&v.toDate?v.toDate():new Date(v);return isNaN(d)?'':d.toLocaleString('de-AT')}catch(e){return ''}}
function load(col,order,lim){return db.collection(col).orderBy(order,'desc').limit(lim||200).get().then(function(s){return s.docs.map(function(d){var x=d.data();x._id=d.id;return x})})}
function count(arr,key){var o={};arr.forEach(function(x){var k=x[key]||'–';o[k]=(o[k]||0)+1});return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).map(function(k){return esc(k)+': '+o[k]}).join(' · ')||'–'}
function sums(P,pre){var o={};P.forEach(function(x){var f=x.features||{};Object.keys(f).forEach(function(k){if(typeof f[k]==='number'&&k.indexOf(pre)===0)o[k]=(o[k]||0)+f[k]})});return o}
function lst(o,strip){var k=Object.keys(o).sort(function(a,b){return o[b]-o[a]});return k.length?'<table>'+k.map(function(n){return '<tr><td>'+esc(strip?n.replace(strip,'').replace(/_/g,' '):nm(n))+'</td><td><b>'+o[n]+'</b></td></tr>'}).join('')+'</table>':'<p class="mut">Noch keine Daten.</p>'}
var NAMEN={abgleich_geprueft:'Lohnzettel-Abgleich: Zeile geprüft',ansicht_monat:'Übersicht geöffnet',ansicht_erfassen:'Erfassen geöffnet',ansicht_konten:'Profil geöffnet',ansicht_einstellungen:'Einstellungen geöffnet',assistent:'Ersteinrichtung abgeschlossen',beruf_geaendert:'Beruf geändert',assistentin:'Mia-Einstellungshilfe gestartet',assistentin_fertig:'Mia-Einstellungshilfe fertig durchlaufen',assistentin_abbruch:'Mia-Einstellungshilfe abgebrochen',rundgang:'Rundgang gestartet',rundgang_fertig:'Rundgang fertig durchlaufen',rundgang_abbruch:'Rundgang abgebrochen',tagfuehrung:'Tägliche Führung gestartet',tagfuehrung_fertig:'Tägliche Führung fertig durchlaufen',tagfuehrung_abbruch:'Tägliche Führung abgebrochen',tag_gespeichert:'Tag gespeichert',notiz:'Notiz zu einem Tag geschrieben',dienst_erfasst:'Bereitschaft/Notdienst erfasst',sicherung:'Sicherung erstellt',geburtstag:'Geburtstagsgruß gezeigt',beruf_fehlt:'Hinweis „Mein Beruf fehlt“ gesendet',kv_gemeldet:'Eigenen Kollektivvertrag gemeldet',lz_erlaubt:'Lohnzettel-Lesen erlaubt',lz_gelesen:'Lohnzettel-PDF gelesen',lz_vorlage:'Lohnzettel-Vorlage geschickt (automatisch)',lz_vorlage_hand:'Lohnzettel-Vorlage geschickt (von Hand)',bericht_tag:'Tagesbericht erstellt',bericht_woche:'Wochenbericht erstellt',bericht_halb:'Halbmonatsbericht erstellt',bericht_monat:'Monatsbericht erstellt',bericht_share_fehler:'Bericht senden: Teilen-Fenster ging nicht (Fehler)',bericht_share_fehlt:'Bericht senden: Gerät kann nicht teilen',mia_frage:'Mia: Frage gestellt',mia_antwort:'Mia: Antwort gegeben',mia_chip:'Mia: Vorschlag angetippt',mia_sprache:'Mia: Sprache benutzt',mia_offen:'Mia: Frage nicht beantwortbar'};
function nm(k){if(NAMEN[k])return NAMEN[k];var m=/^dienst_neu_(.+)$/.exec(k);if(m)return 'Neue Bereitschaft: '+m[1];m=/^sprache_(.+)$/.exec(k);if(m)return 'Sprache gewählt: '+m[1];m=/^tab_(.+)$/.exec(k);if(m)return 'Reiter geöffnet: '+m[1];return k.replace(/_/g,' ')}
var ARTEN={wunsch:'Wunsch / Hinweis',fehler:'Fehler',lob:'Lob',frage:'Frage'};
function art(x){var t=String(x.text||''),m=/^\[([^\]]+)\]/.exec(t);return m?m[1]:(ARTEN[x.art]||x.art||'Rückmeldung')}
function aktiv(x,days){var l=(x.features&&x.features.aktiv)||[],lim=new Date(Date.now()-days*864e5).toISOString().slice(0,10);return l.filter(function(d){return d>=lim}).length}
var REPORT='';
function pl(o,strip){return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).map(function(k){return '- '+(strip?k.replace(strip,'').replace(/_/g,' '):nm(k))+': '+o[k]}).join('\n')||'- noch keine'}
function report(P,F,M,S,fun,mm,mia){
 var L=['STUNDEN-CHECKER VERWALTUNG, Stand '+new Date().toLocaleString('de-AT'),'',
 'ÜBERBLICK','Konten: '+P.length+', Rückmeldungen: '+F.length,'Berufe: '+count(P,'beruf').replace(/&amp;/g,'&'),'Sprachen: '+count(P,'lang'),'Versionen: '+count(P,'version'),'',
 'NUTZUNG DER FUNKTIONEN',pl(fun),'','MIA',pl(mm),'Themen:',pl(mia,'mia_t_'),'',
 'RÜCKMELDUNGEN (nur offene)'].concat(F.filter(function(x){return st(x)!=='erledigt'}).length?F.filter(function(x){return st(x)!=='erledigt'}).map(function(x){return '['+art(x)+'] '+(x.email||'ohne Konto')+', '+fmt(x.t)+'\n'+(x.text||'')+(x.img?'\n(mit Bild)':'')}):['- keine'],['','KONTEN'],P.map(function(x){return '- '+x.email+' | Beruf '+(x.beruf||x.paket||'?')+' | '+(x.tage||0)+' Tage | aktiv 7/30: '+aktiv(x,7)+'/'+aktiv(x,30)+' | '+(x.lang||'')+' | Version '+(x.version||'?')+' | zuletzt '+fmt(x.lastSeen)}),['','FRAGEN, DIE MIA NICHT BEANTWORTEN KONNTE'],M.length?M.map(function(x){return '- '+x.text+' ('+(x.lang||'')+', '+fmt(x.t)+')'}):['- keine'],['','ABWEICHUNGEN (anonym)'],S.length?S.map(function(x){return '- '+x.monat+' '+(x.beruf||x.paket||'')+': '+(x.zeilen||[]).map(function(z){return z.z+':'+z.s+(z.d!=null?' '+z.d:'')}).join(', ')}):['- keine']);
 return L.join('\n');
}
var FB=[],FILT='offen',LOCAL={};
try{LOCAL=JSON.parse(localStorage.getItem('sc.fbstatus')||'{}')}catch(e){}
function st(x){return x.status||LOCAL[x._id]||'offen'}
function fbText(x){return 'RÜCKMELDUNG AUS DEM STUNDEN-CHECKER\nArt: '+art(x)+'\nVon: '+(x.email||'ohne Konto')+'\nAm: '+fmt(x.t)+'\nAnsicht: '+(x.view||'?')+', Gerät: '+(x.geraet||'unbekannt')+', Sprache: '+(x.lang||'?')+', Version: '+(x.version||'?')+'\n\n'+(x.text||'')+(x.img?'\n\n(mit Bild, hier nicht enthalten)':'')}
function drawFb(){
 var L=FB.filter(function(x){return FILT==='alle'||st(x)===(FILT==='erledigt'?'erledigt':'offen')});
 var no=FB.filter(function(x){return st(x)!=='erledigt'}).length;
 document.querySelectorAll('#fbf button').forEach(function(b){b.style.opacity=b.dataset.f===FILT?'1':'.55'});
 $('#fbm').textContent=no+' offen, '+(FB.length-no)+' erledigt';
 $('#fbl').innerHTML=L.length?L.map(function(x){var e=st(x)==='erledigt';return '<div class="fb"><b>'+esc(art(x))+'</b> · '+esc(x.email||'ohne Konto')+' · <span class="mut">'+fmt(x.t)+'</span> · <b style="color:'+(e?'#2e7d32':'#b45309')+'">'+(e?'Erledigt':'Noch offen')+'</b><div class="mut">Gerät: '+esc(x.geraet||'unbekannt')+'</div><div>'+esc(x.text)+'</div>'+(x.img&&/^data:image\/jpeg;base64,/.test(x.img)?'<img alt="Bild zur Rückmeldung" src="'+x.img+'">':'')+'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button type="button" data-cl="'+esc(x._id)+'">An Claude übertragen</button><button type="button" data-st="'+esc(x._id)+'">'+(e?'Wieder offen':'Erledigt')+'</button></div></div>'}).join(''):'<p class="mut">Nichts in dieser Ansicht.</p>';
}
function copyText(t,msg){function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');$('#fbm').textContent=msg}catch(e){$('#fbm').textContent='Kopieren nicht möglich.'}a.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){$('#fbm').textContent=msg},fb);else fb()}
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('button');if(!b)return;
 if(b.dataset.f){FILT=b.dataset.f;drawFb();return}
 if(b.dataset.cl){var x=FB.filter(function(y){return y._id===b.dataset.cl})[0];if(x)copyText(fbText(x),'Kopiert. Jetzt im Chat einfügen.');return}
 if(b.dataset.st){var y=FB.filter(function(z){return z._id===b.dataset.st})[0];if(!y)return;var neu=st(y)==='erledigt'?'offen':'erledigt';y.status=neu;LOCAL[y._id]=neu;try{localStorage.setItem('sc.fbstatus',JSON.stringify(LOCAL))}catch(e){}
  drawFb();db.collection('feedback').doc(y._id).update({status:neu}).catch(function(){$('#fbm').textContent+=' (Status nur in diesem Browser gespeichert)'});}
});
function run(){
 Promise.all([load('profiles','lastSeen'),load('feedback','t'),load('miaOffen','t'),load('statistik','t')]).then(function(r){
  var P=r[0],F=r[1],M=r[2],S=r[3];
  $('#ov').innerHTML='<p><b>'+P.length+'</b> Konten · <b>'+F.length+'</b> Rückmeldungen</p><p class="mut">Berufe: '+count(P,'beruf')+'</p><p class="mut">Sprachen: '+count(P,'lang')+'</p><p class="mut">Versionen: '+count(P,'version')+'</p>';
  var all=sums(P,''),mia=sums(P,'mia_t_'),fun={};Object.keys(all).forEach(function(k){if(k.indexOf('mia_t_')!==0)fun[k]=all[k]});
  $('#fe').innerHTML=lst(fun);
  var mm={};['mia_frage','mia_antwort','mia_chip','mia_sprache','mia_offen'].forEach(function(k){if(all[k])mm[k]=all[k]});
  $('#mi').innerHTML=lst(mm)+'<p class="mut" style="margin-top:10px">Themen, zu denen Mia antwortet:</p>'+lst(mia,'mia_t_');
  FB=F;drawFb();
  var byReg=P.slice().sort(function(a,b){return String(b.created||'')<String(a.created||'')?-1:1});
  $('#an').innerHTML='<table><tr><th>E-Mail</th><th>Registriert am</th><th>Letzte Anmeldung</th><th>Zuletzt in der App</th><th>Version</th><th>Gerät</th></tr>'+byReg.map(function(x){return '<tr><td>'+esc(x.email)+'</td><td>'+fmt(x.created)+'</td><td>'+fmt(x.lastLogin)+'</td><td>'+fmt(x.lastSeen)+'</td><td>'+esc(x.version)+'</td><td>'+esc(x.geraet||'unbekannt')+'</td></tr>'}).join('')+'</table>';
  $('#wk').innerHTML=P.map(function(x){var f=x.features||{},o={};Object.keys(f).forEach(function(k){if(typeof f[k]==='number')o[k]=f[k]});var n=Object.keys(o).reduce(function(a,k){return a+o[k]},0);return '<details style="border-bottom:1px solid var(--line);padding:6px 0"><summary><b>'+esc(x.email||'ohne E-Mail')+'</b> <span class="mut">· '+esc(x.beruf||x.paket||'')+' · '+n+' Aktionen</span></summary>'+lst(o)+'</details>'}).join('')||'<p class="mut">Noch keine.</p>';
  $('#pl').innerHTML='<table><tr><th>E-Mail</th><th>Beruf</th><th>Erfasste Tage</th><th>Aktive Tage (letzte 7 / 30)</th><th>Sprache</th><th>Registriert am</th><th>Zuletzt in der App</th><th>Gerät</th></tr>'+P.map(function(x){return '<tr><td>'+esc(x.email)+'</td><td>'+esc(x.beruf||'noch nicht eingerichtet')+'</td><td>'+esc(x.tage)+'</td><td>'+aktiv(x,7)+' / '+aktiv(x,30)+'</td><td>'+esc(x.lang)+'</td><td>'+fmt(x.created)+'</td><td>'+fmt(x.lastSeen)+'</td><td>'+esc(x.geraet||'unbekannt')+'</td></tr>'}).join('')+'</table>';
  $('#mo').innerHTML=M.length?M.map(function(x){return '<div class="fb">'+esc(x.text)+' <span class="mut">('+esc(x.lang||'')+', '+fmt(x.t)+')</span></div>'}).join(''):'<p class="mut">Noch keine.</p>';
  $('#st').innerHTML=S.length?'<table><tr><th>Zeitpunkt</th><th>Monat</th><th>Beruf</th><th>Zeilen</th></tr>'+S.map(function(x){return '<tr><td>'+fmt(x.t)+'</td><td>'+esc(x.monat)+'</td><td>'+esc(x.beruf||x.paket)+'</td><td>'+esc((x.zeilen||[]).map(function(z){return z.z+':'+z.s+(z.d!=null?' '+z.d:'')}).join(', '))+'</td></tr>'}).join('')+'</table>':'<p class="mut">Noch keine.</p>';
 REPORT=report(P,F,M,S,fun,mm,mia);
 },function(e){$('#ov').textContent='Kein Zugriff oder noch nicht eingerichtet ('+(e&&e.code||e)+').'});
}
auth.onAuthStateChanged(function(u){
 $('#who').textContent=u?('Angemeldet als '+u.email):'Nicht angemeldet.';
 $('#lf').hidden=!!u;$('#gl').hidden=!!u;$('#out').hidden=!u;
 var ok=!!(u&&u.emailVerified);
 $('#ver').textContent=u?(ok?'E-Mail-Adresse ist bestätigt.':'E-Mail-Adresse ist noch NICHT bestätigt. Tippe auf „Bestätigungsmail senden“, öffne die Mail, tippe den Link an und dann hier auf „Neu prüfen“.'):'';
 $('#vs').hidden=!u||ok;$('#vr').hidden=!u||ok;
 $('#dash').hidden=!ok;
 if(ok)run();
});
$('#lf').addEventListener('submit',function(e){e.preventDefault();$('#msg').textContent='';auth.signInWithEmailAndPassword($('#m').value.trim(),$('#p').value).catch(function(){$('#msg').textContent='E-Mail oder Passwort stimmt nicht.'})});
$('#gl').addEventListener('click',function(){$('#msg').textContent='';auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(){$('#msg').textContent='Die Anmeldung mit Google hat nicht geklappt.'})});
$('#cp').addEventListener('click',function(){var t=REPORT;if(!t){$('#cpm').textContent='Noch nichts geladen.';return}
 function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');$('#cpm').textContent='Kopiert. Jetzt im Chat einfügen.'}catch(e){$('#cpm').textContent='Kopieren ging nicht. Nimm „Als Textdatei speichern“.'}document.body.removeChild(a)}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){$('#cpm').textContent='Kopiert. Jetzt im Chat einfügen.'},fb);else fb()});
$('#dl').addEventListener('click',function(){var t=REPORT;if(!t){$('#cpm').textContent='Noch nichts geladen.';return}var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='stundenchecker-verwaltung-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a)});
$('#out').addEventListener('click',function(){auth.signOut()});
$('#vs').addEventListener('click',function(){auth.currentUser.sendEmailVerification().then(function(){$('#ver').textContent='Mail ist unterwegs. Schau auch im Spam-Ordner.'},function(){$('#ver').textContent='Das hat nicht geklappt. Bitte in ein paar Minuten noch einmal probieren.'})});
$('#vr').addEventListener('click',function(){auth.currentUser.reload().then(function(){return auth.currentUser.getIdToken(true)}).then(function(){location.reload()})});
})();
</script></body></html>
